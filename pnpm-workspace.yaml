packages:
  - "apps/*"

# Bump shared versions here, then `pnpm install`.
# Next 16 / TypeScript 6+ / ESLint 10 stay out until we choose them.
catalog:
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 5.9.3
  "@types/react": 19.3.0
  "@sanity/client": 8.9.0
  sanity: 6.18.0
  "@sanity/schema": 6.18.0
  "@sanity/vision": 6.18.0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@base-ui/react@1.8.0'
  - '@base-ui/utils@0.4.0'
  - '@types/react-dom@19.3.0'
  - shadcn@4.21.0
  - sanity-plugin-media@6.3.1
  - '@sanity/client@8.9.0'
  - sanity@6.18.0
  - '@sanity/schema@6.18.0'
  - '@sanity/vision@6.18.0'
  - '@sanity/access-ui@6.18.0'
  - '@sanity/diff@6.18.0'
  - '@sanity/mutator@6.18.0'
  - '@sanity/types@6.18.0'
  - '@sanity/util@6.18.0'
  - '@sanity/validation@6.18.0'
