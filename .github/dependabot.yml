# Dependabot: weekly PRs inside the current majors.
# Next 16 / TypeScript 6+ / ESLint 10 are ignored until we choose them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      sanity:
        patterns:
          - "sanity"
          - "@sanity/*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@portabletext/block-tools"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sanity/client"
        update-types: ["version-update:semver-major"]

  # Workflow actions (checkout, setup-node, pnpm). One grouped PR a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
