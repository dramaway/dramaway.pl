# knowledge.yaml — Knowledge Context Protocol manifest
# Spec: https://cantara.github.io/knowledge-context-protocol/

schema_version: "1.0"
project:
  name: "DramaWay foundation site"
  description: "Redesign of fundacja.dramaway.pl — Next.js 15 + Sanity v3 + Netlify"
  type: "web-app"

apps:
  - path: apps/web
    description: "Next.js 15 frontend (Tailwind v4 + shadcn/ui)"
  - path: apps/studio
    description: "Sanity Studio v6 — schema, Media library plugin, hosted at dramaway.sanity.studio"

knowledge:
  primary_context:
    - path: CLAUDE.md
      description: "Agent hub: stack, MVP scope, what not to commit"
      priority: critical
    - path: AGENTS.md
      description: "Pointer to CLAUDE.md"
      priority: high
    - path: README.md
      description: "Human-facing project overview (Polish)"
      priority: high

  documentation:
    - path: docs/HANDOFF.md
      description: "Living session handoff — status and next steps"
      priority: critical
    - path: docs/README.md
      description: "Documentation map"
      priority: high
    - path: docs/concept/ustalenia-2026-09-05.md
      description: "Closed 2026-09-05 IA/subpage decisions; delta for Czytelnia migration plan; paste-ready prompts"
      priority: critical
    - path: docs/concept/
      description: "IA and Art Generacje product assumptions"
      priority: high
    - path: docs/design/system.md
      description: "UI canon: design tokens, composition classes, primitives, how to add a section"
      priority: critical
    - path: docs/design/figma-baseline.md
      description: "Measured Figma values: screen node IDs, colours, type scale, circle and image geometry"
      priority: high
    - path: docs/design/wireframes.html
      description: "Grey subpage wireframes — layout recipes, Figma hubs vs IA, what exists / scales / needs building"
      priority: high
    - path: docs/decisions/
      description: "Architecture Decision Records"
      priority: high
    - path: docs/guides/sanity-roles.md
      description: "Sanity handover: org billing vs project Admin/Editor/Developer, admin@dramaway.pl backup, pre-client snapshot"
      priority: high
    - path: docs/guides/cutover-foundation.md
      description: "Foundation-facing cutover checklist: privacy policy, analytics decision, paste-ready email"
      priority: high
    - path: docs/guides/dependencies.md
      description: "How to update dependencies: pnpm catalog, Dependabot, scripts"
      priority: medium
    - path: docs/migration/fundacja-status.md
      description: "What is already in Sanity, conversion gaps, next steps before Figma"
      priority: high
    - path: docs/migration/
      description: "Drupal inventory, fundacja status, legacy layout on disk"
      priority: medium

  local_only:
    - path: private/README.md
      description: "Where SQL dumps live (dumps themselves are gitignored)"
      priority: medium
      optional: true
